name: Sentinel validation

on:
  push:
    paths:
      - DevOps_K8s_Sentinel_PRODUCTION_READY_FINAL.sh
      - DevOps_K8s_Sentinel_v368_2_KING_FEATURE_RELIABILITY_PRODUCTION.sh
      - .github/workflows/sentinel-validation.yml
  pull_request:
    paths:
      - DevOps_K8s_Sentinel_PRODUCTION_READY_FINAL.sh
      - DevOps_K8s_Sentinel_v368_2_KING_FEATURE_RELIABILITY_PRODUCTION.sh
      - .github/workflows/sentinel-validation.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sentinel-validation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate-current-bash:
    name: Current Bash / ${{ matrix.release }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - release: v367.8
            script: DevOps_K8s_Sentinel_PRODUCTION_READY_FINAL.sh
            contract: --v3678-selftest
          - release: v368.2
            script: DevOps_K8s_Sentinel_v368_2_KING_FEATURE_RELIABILITY_PRODUCTION.sh
            contract: --v368-selftest
    env:
      SENTINEL_SCRIPT: ${{ matrix.script }}
      SENTINEL_EXPORT_DIR: ${{ runner.temp }}/sentinel-exports
      EXPORT_DIR: ${{ runner.temp }}/sentinel-exports
      HOME: ${{ runner.temp }}/sentinel-home
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Prepare isolated validation directories
        run: |
          mkdir -p "$SENTINEL_EXPORT_DIR" "$HOME"
          chmod 700 "$SENTINEL_EXPORT_DIR" "$HOME"
          chmod 750 "$SENTINEL_SCRIPT"

      - name: Bash syntax
        run: bash -n "$SENTINEL_SCRIPT"

      - name: Release-specific contracts
        run: bash "$SENTINEL_SCRIPT" "${{ matrix.contract }}"

      - name: Complete local self-tests
        run: bash "$SENTINEL_SCRIPT" --selftest-all

      - name: Local validation and security checks
        run: |
          bash "$SENTINEL_SCRIPT" --validate-all-local
          bash "$SENTINEL_SCRIPT" --security-selftest

      - name: Full mocked regression suite
        run: bash "$SENTINEL_SCRIPT" --validate-v366

      - name: Embedded dataset validation
        if: matrix.release == 'v368.2'
        run: bash "$SENTINEL_SCRIPT" --internet-data-validate

  validate-bash-44:
    name: Bash 4.4 / ${{ matrix.release }}
    runs-on: ubuntu-latest
    container: bash:4.4
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - release: v367.8
            script: DevOps_K8s_Sentinel_PRODUCTION_READY_FINAL.sh
            contract: --v3678-selftest
          - release: v368.2
            script: DevOps_K8s_Sentinel_v368_2_KING_FEATURE_RELIABILITY_PRODUCTION.sh
            contract: --v368-selftest
    env:
      SENTINEL_SCRIPT: ${{ matrix.script }}
      SENTINEL_EXPORT_DIR: /tmp/sentinel-exports
      EXPORT_DIR: /tmp/sentinel-exports
      HOME: /tmp/sentinel-home
    steps:
      - name: Install portable test dependencies
        run: apk add --no-cache coreutils findutils grep sed gawk util-linux openssl jq python3

      - name: Check out repository
        uses: actions/checkout@v4

      - name: Verify runtime and prepare directories
        run: |
          bash --version
          test "$(bash -c 'printf %s "${BASH_VERSINFO[0]}.${BASH_VERSINFO[1]}"')" = "4.4"
          mkdir -p "$SENTINEL_EXPORT_DIR" "$HOME"
          chmod 700 "$SENTINEL_EXPORT_DIR" "$HOME"
          chmod 750 "$SENTINEL_SCRIPT"

      - name: Bash 4.4 syntax and release contracts
        run: |
          bash -n "$SENTINEL_SCRIPT"
          bash "$SENTINEL_SCRIPT" "${{ matrix.contract }}"

      - name: Bash 4.4 complete self-tests
        run: bash "$SENTINEL_SCRIPT" --selftest-all

      - name: Bash 4.4 security regression
        run: bash "$SENTINEL_SCRIPT" --security-selftest
